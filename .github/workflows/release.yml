# ScrapeLock: builds scrapelock.zip and publishes it as a GitHub Release, free to download. The zip has
# the scrapelock/ folder, ready for Plugins → Add New → Upload Plugin.
# Two ways to start it: push a version tag (e.g. v2.2.2), or Actions → Release → Run workflow on main,
# which creates the tag v<Version> itself. "Replace the zip" rebuilds the zip of a release that already exists
# (same version, e.g. a fix during the WordPress.org review): it moves the tag to this commit and replaces the
# files, and keeps the release notes as they are.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      replace:
        description: 'Replace the zip of an existing release (same version, notes kept)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish the release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that the tag matches the plugin version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^ \* Version: *//p' scrapelock.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          constant=$(sed -n "s/^define( 'PNCP_VERSION', '\(.*\)' );/\1/p" scrapelock.php)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run the release from main"; exit 1; fi
            tag="v$version"
            if gh release view "$tag" > /dev/null 2>&1; then
              if [ "${{ inputs.replace }}" != "true" ]; then echo "::error::Release $tag already exists (choose \"Replace the zip\" to rebuild it)"; exit 1; fi
              echo "REPLACE=1" >> "$GITHUB_ENV"
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ "v$version" != "$tag" ] || [ "$version" != "$stable" ] || [ "$version" != "$constant" ]; then
            echo "::error::Tag $tag, Version $version, Stable tag $stable, PNCP_VERSION $constant: they must match"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Syntax check (php -l)
        run: find . -name '*.php' -not -path './tests/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Build scrapelock.zip (only the plugin, see .gitattributes)
        run: |
          git archive --format=zip --prefix=scrapelock/ -o scrapelock.zip HEAD
          if unzip -l scrapelock.zip | grep -qE 'tests/|\.po$|\.mo$'; then echo "::error::tests or translations in the zip"; exit 1; fi
          cp scrapelock.zip "scrapelock-$VERSION.zip"
      - name: Release notes from readme.txt
        run: |
          {
            echo "ScrapeLock $VERSION – Content & AI Bot Protection for WordPress."
            echo
            echo "Install: download **scrapelock.zip** below, then in WordPress go to Plugins → Add New → Upload Plugin."
            echo
            echo "### Changes"
            awk -v v="= $VERSION =" '$0 == v {on=1; next} /^= / && on {exit} on' readme.txt
          } > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$REPLACE" ]; then
            # Same version rebuilt: the tag moves to this commit, the files are replaced, the notes stay.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload "$TAG" scrapelock.zip "scrapelock-$VERSION.zip" --clobber
            exit 0
          fi
          # From a tag push the tag exists; from Run workflow the release creates it on this commit.
          gh release create "$TAG" scrapelock.zip "scrapelock-$VERSION.zip" --title "ScrapeLock $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
