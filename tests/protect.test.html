<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<title>PNCP – έλεγχος protect.js</title>
<link rel="stylesheet" href="../assets/css/protect.css">
</head>
<!--
	Άνοιξέ το μέσω τοπικού server από τον φάκελο του plugin:
	python3 -m http.server 8765   →   http://localhost:8765/tests/protect.test.html
-->
<body class="pncp-protected pncp-no-select pncp-print-source">
<p id="txt">Κείμενο οδηγού που προστατεύεται.</p>
<p class="pncp-allow" id="phone">2810 000 000</p>
<p id="short">Λέξη</p>
<input id="inp" value="κουπόνι">
<img id="img" alt="" width="20" height="20" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
<pre id="out"></pre>
<script>
window.pncpConfig = {
	selection: true, contextMenu: true, shortcuts: true, devtools: true, imageDrag: true, minChars: 10,
	copyMode: 'attribution', printMode: 'source', showMessage: true,
	message: 'Το περιεχόμενο προστατεύεται.', sourceTitle: 'Οδηγός',
	sourceUrl: 'https://example.com/odigos/', siteName: 'Example',
	i18n: { source: 'Πηγή', printBlock: 'Όχι εκτύπωση' }
};
</script>
<script src="../assets/js/protect.js"></script>
<script>
( function () {
	var out = [], fails = 0;
	function fire( el, type, init ) {
		init = init || {};
		var Ctor = init.ctor || Event;
		var ev = new Ctor( type, Object.assign( { bubbles: true, cancelable: true }, init ) );
		el.dispatchEvent( ev );
		return ev.defaultPrevented;
	}
	function check( name, actual, expected ) {
		var ok = actual === expected;
		if ( ! ok ) { fails++; }
		out.push( ( ok ? 'PASS ' : 'FAIL ' ) + name + ( ok ? '' : ' (πήρε ' + JSON.stringify( actual ) + ')' ) );
	}
	function copyFrom( el ) {
		var r = document.createRange(), s = getSelection();
		r.selectNodeContents( el ); s.removeAllRanges(); s.addRange( r );
		var dt = new DataTransfer(), ev = new ClipboardEvent( 'copy', { bubbles: true, cancelable: true, clipboardData: dt } );
		el.dispatchEvent( ev );
		return { prevented: ev.defaultPrevented, plain: dt.getData( 'text/plain' ) };
	}
	var txt = document.getElementById( 'txt' ), phone = document.getElementById( 'phone' );
	var inp = document.getElementById( 'inp' ), img = document.getElementById( 'img' );
	var K = KeyboardEvent;

	check( 'δεξί κλικ σε κείμενο μπλοκάρεται', fire( txt, 'contextmenu' ), true );
	check( 'δεξί κλικ σε input επιτρέπεται', fire( inp, 'contextmenu' ), false );
	check( 'δεξί κλικ σε .pncp-allow επιτρέπεται', fire( phone, 'contextmenu' ), false );
	check( 'Ctrl+U με ελληνική διάταξη μπλοκάρεται', fire( txt, 'keydown', { ctor: K, key: 'θ', code: 'KeyU', ctrlKey: true } ), true );
	check( 'Ctrl+A μέσα σε input επιτρέπεται', fire( inp, 'keydown', { ctor: K, key: 'a', code: 'KeyA', ctrlKey: true } ), false );
	check( 'Ctrl+V δεν πειράζεται', fire( txt, 'keydown', { ctor: K, key: 'v', code: 'KeyV', ctrlKey: true } ), false );
	check( 'Tab δεν πειράζεται', fire( txt, 'keydown', { ctor: K, key: 'Tab', code: 'Tab' } ), false );
	check( 'σύρσιμο εικόνας μπλοκάρεται', fire( img, 'dragstart' ), true );
	check( 'επιλογή σε input επιτρέπεται', fire( inp, 'selectstart' ), false );
	check( 'επιλογή κειμένου: user-select none', getComputedStyle( txt ).userSelect, 'none' );
	check( 'επιλογή .pncp-allow: user-select text', getComputedStyle( phone ).userSelect, 'text' );
	check( 'αντιγραφή από .pncp-allow χωρίς αλλαγή', copyFrom( phone ).prevented, false );

	document.body.classList.remove( 'pncp-no-select' );
	var c = copyFrom( txt );
	check( 'αντιγραφή με πηγή: προσαρτά σύνδεσμο', c.plain.indexOf( 'https://example.com/odigos/' ) > -1, true );
	var shortEl = document.getElementById( 'short' );
	check( 'σύντομη αντιγραφή (< minChars) χωρίς πηγή', copyFrom( shortEl ).prevented, false );
	document.body.classList.add( 'pncp-no-select' );

	check( 'F12 μπλοκάρεται', fire( txt, 'keydown', { ctor: K, key: 'F12', code: 'F12' } ), true );
	check( 'Ctrl+Shift+I μπλοκάρεται', fire( txt, 'keydown', { ctor: K, key: 'I', code: 'KeyI', ctrlKey: true, shiftKey: true } ), true );
	check( 'Cmd+Opt+U (Mac) μπλοκάρεται', fire( txt, 'keydown', { ctor: K, key: '¨', code: 'KeyU', metaKey: true, altKey: true } ), true );
	check( 'Ctrl+Shift+V δεν πειράζεται', fire( txt, 'keydown', { ctor: K, key: 'V', code: 'KeyV', ctrlKey: true, shiftKey: true } ), false );

	check( 'AZERTY: Ctrl+A (e.key a, code KeyQ) αναγνωρίζεται', fire( txt, 'keydown', { ctor: K, key: 'a', code: 'KeyQ', ctrlKey: true } ), true );
	check( 'Ctrl+X με επιλογή μέσα σε .pncp-allow επιτρέπεται', ( function () {
		var r = document.createRange(); r.selectNodeContents( phone ); getSelection().removeAllRanges(); getSelection().addRange( r );
		return fire( document.body, 'keydown', { ctor: K, key: 'x', code: 'KeyX', ctrlKey: true } );
	} )(), false );

	window.pncpConfig.copyMode = 'block';
	document.body.classList.remove( 'pncp-no-select' );
	check( 'block: αντιγραφή κειμένου μπλοκάρεται', copyFrom( txt ).prevented, true );
	check( 'block: αντιγραφή από .pncp-allow επιτρέπεται', copyFrom( phone ).prevented, false );
	check( 'block: επιλογή από .pncp-allow προς κείμενο μπλοκάρεται', ( function () {
		getSelection().setBaseAndExtent( phone.firstChild, 3, txt.firstChild, 5 );
		var ev = new ClipboardEvent( 'copy', { bubbles: true, cancelable: true, clipboardData: new DataTransfer() } );
		phone.dispatchEvent( ev );
		return ev.defaultPrevented;
	} )(), true );
	document.body.classList.add( 'pncp-no-select' );
	window.pncpConfig.copyMode = 'attribution';

	var t = document.querySelector( '.pncp-toast' );
	check( 'μήνυμα με role=status', t && t.getAttribute( 'role' ), 'status' );
	check( 'πηγή εκτύπωσης στο body', document.body.getAttribute( 'data-pncp-source' ), 'Πηγή: https://example.com/odigos/' );

	out.push( '', fails ? fails + ' αποτυχίες' : 'Όλα OK' );
	document.getElementById( 'out' ).textContent = out.join( '\n' );
	document.title = fails ? 'FAIL' : 'OK';
} )();
</script>
</body>
</html>
